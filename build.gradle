buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        // https://github.com/Codearte/gradle-nexus-staging-plugin#tasks
        classpath "io.codearte.gradle.nexus:gradle-nexus-staging-plugin:0.30.0"
    }
}

allprojects {
    repositories {
        google()
        mavenLocal()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
        maven { url "https://s01.oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://s01.oss.sonatype.org/content/repositories/releases/" }
        maven { url "https://central.sonatype.com/repository/maven-snapshots/" }
    }
}

// TODO Migrate off this legacy setup to the "com.vanniktech.maven.publish" plugin.
//  This whole publishing block (maven-publish + signing + nexus-staging) talks to
//  Maven Central only through the "OSSRH Staging API" compatibility shim (visible as
//  "(via OSSRH Staging API)" on deployments in the Central Portal UI) - a back-compat
//  bridge in front of infrastructure Sonatype has otherwise replaced, not the modern
//  Central Publisher API. "com.vanniktech.maven.publish" talks to the native Publisher
//  API directly and handles signing/credentials/snapshots out of the box. Migrating is
//  a real priority, not a someday-cleanup item.
//  https://vanniktech.github.io/gradle-maven-publish-plugin/central/

// As ugly as it gets, but Nexus Staging plugin must be applied to the root project only.
apply plugin: 'io.codearte.nexus-staging'

nexusStaging {
    // OSSRH shut down in 2025. Keep the legacy staging-plugin workflow through
    // Maven Central's OSSRH Staging API compatibility endpoint.
    serverUrl = 'https://ossrh-staging-api.central.sonatype.com/service/local/'
    packageGroup = 'com.crashinvaders.vfx'
    username = ossrhUsername
    password = ossrhPassword
}

/** Checks if the property exists. If it doesn't - try to resolve it from the environment variable. */
void resolveProperty(String propertyName, String envVariableName) {
    if (!project.hasProperty(propertyName)) {
        project.ext.propertyName = System.getenv(envVariableName)
        if (!project.ext.propertyName) {
            println "$propertyName is not defined"
        } else {
            println "$propertyName has been set from an environment variable."
        }
    }
}
// Setup Nexus repo and GitHub package repo credentials.
// They usually defined in user global gradle.properties file
// or as environment variables (Travis-CI).
resolveProperty('ossrhUsername', 'OSSRH_USERNAME')
resolveProperty('ossrhPassword', 'OSSRH_PASSWORD')

apply from: 'gradle/github-release.gradle'

githubReleaseDraft {
    githubRepository = 'crashinvaders/gdx-vfx'
    mavenGroup = 'com.crashinvaders.vfx'
    artifactIds = ['gdx-vfx-core', 'gdx-vfx-effects', 'gdx-vfx-gwt']
}
